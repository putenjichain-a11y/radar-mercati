<head>

<title>Radar Mercati</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
:root {
  --bg: #eef1f5; --surface: #ffffff; --sunk: #f5f7fa; --line: #d6dce5; --grid: #e6eaf0;
  --fg: #16202c; --muted: #5b6878; --faint: #8994a3;
  --ink: #1f4e8c; --ink-soft: #e2ebf7;
  --gain: #15784a; --loss: #b2362e; --todo: #a8650a;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --cond: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10161e; --surface: #18212c; --sunk: #141c26; --line: #2a3644; --grid: #222d3a;
  --fg: #e3e9f0; --muted: #96a3b4; --faint: #6c7a8c;
  --ink: #82b2ee; --ink-soft: #1f3048;
  --gain: #5cc792; --loss: #ef837a; --todo: #e3a84a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #10161e; --surface: #18212c; --sunk: #141c26; --line: #2a3644; --grid: #222d3a;
  --fg: #e3e9f0; --muted: #96a3b4; --faint: #6c7a8c;
  --ink: #82b2ee; --ink-soft: #1f3048;
  --gain: #5cc792; --loss: #ef837a; --todo: #e3a84a; color-scheme: dark }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.45;
  padding-top: env(safe-area-inset-top,0px); padding-bottom: env(safe-area-inset-bottom,0px) }
.wrap { max-width: 1120px; margin: 0 auto; padding: 22px 16px 64px; display: flex; flex-direction: column; gap: 16px }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums }
.gain { color: var(--gain) } .loss { color: var(--loss) } .muted { color: var(--muted) }
button { font: inherit; cursor: pointer; color: inherit }
a { color: var(--ink) }

header.top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline }
header.top h1 { font-family: var(--cond); font-size: 30px; font-weight: 600; margin: 0; letter-spacing: .2px }
header.top .sub { color: var(--muted); font-size: 13.5px }
header.top .spacer { margin-left: auto }
.ghost { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 13px }
.ghost:hover { border-color: var(--ink) }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px }
.ph { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline }
.ph h2 { font-family: var(--cond); font-size: 19px; font-weight: 600; margin: 0 }
.ph .note { font-size: 12.5px; color: var(--muted) }
.ph .spacer { margin-left: auto }
.lbl-s { font-size: 12.5px; color: var(--muted) }

.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.seg { font-size: 13px; padding: 5px 11px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px }
.seg:hover { border-color: var(--ink) }
.seg[aria-pressed="true"] { background: var(--ink-soft); border-color: var(--ink); color: var(--ink); font-weight: 500 }
input[type="search"] { font: inherit; font-size: 14px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--sunk); color: var(--fg); min-width: 150px; flex: 1 1 150px; max-width: 260px }

.rows { display: flex; flex-direction: column }
.row { display: grid; grid-template-columns: 26px minmax(0,1fr) auto auto; gap: 6px 10px; align-items: center;
  padding: 9px 0; border-bottom: 1px solid var(--grid) }
.row:last-child { border-bottom: 0 }
.row .star { background: none; border: 0; padding: 0; font-size: 15px; line-height: 1; color: var(--faint) }
.row .star[aria-pressed="true"] { color: var(--todo) }
.row .who { min-width: 0 }
.row .sym { font-family: var(--mono); font-weight: 600; font-size: 14px }
.row .nome { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.row .last { font-family: var(--mono); font-size: 15px; text-align: right }
.row .pct { font-family: var(--mono); font-size: 14px; font-weight: 600; text-align: right; min-width: 74px }
.row .range { grid-column: 2 / -1; height: 4px; background: var(--grid); border-radius: 2px; position: relative; margin-top: 2px }
.row .range i { position: absolute; top: -2px; width: 2px; height: 8px; background: var(--fg); border-radius: 1px }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap }

.news { display: flex; flex-direction: column }
.nw { display: grid; grid-template-columns: 62px minmax(0,1fr); gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--grid); font-size: 14px }
.nw:last-child { border-bottom: 0 }
.nw .t { font-family: var(--mono); font-size: 12.5px; color: var(--muted) }

.day { font-family: var(--cond); font-size: 15px; font-weight: 600; margin-top: 10px; padding-bottom: 4px; border-bottom: 1px solid var(--line); text-transform: capitalize }
.ev { display: grid; grid-template-columns: 52px 18px minmax(0,1fr) auto; gap: 10px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--grid); font-size: 14px }
.ev:last-child { border-bottom: 0 }
.ev .t { font-family: var(--mono); font-size: 12.5px; color: var(--muted) }
.ev .imp { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); display: inline-block }
.ev .imp.alto { background: var(--loss) } .ev .imp.medio { background: var(--todo) }
.ev .val { font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: nowrap }
.ev .cc { font-size: 11px; color: var(--muted); font-family: var(--mono) }
.ev .sym { font-family: var(--mono); font-size: 13.5px }

.sintesi { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(160px,100%),1fr)); gap: 12px 18px; align-items: end }
.tile .k { font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted) }
.tile .v { font-family: var(--mono); font-size: 27px; font-weight: 500; line-height: 1.15 }
.tile .s { font-size: 12.5px; color: var(--muted) }
.breadth { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--grid); margin-top: 6px }
.breadth i { display: block; height: 100% }
.breadth .su { background: var(--gain) } .breadth .giu { background: var(--loss) }
.legenda { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); margin-top: 5px; flex-wrap: wrap }
.legenda b { font-family: var(--mono); color: var(--fg) }
.mag { height: 6px; border-radius: 3px; background: var(--grid); position: relative; overflow: hidden }
.mag i { position: absolute; top: 0; bottom: 0; left: 50%; }
.mag i.su { background: var(--gain) } .mag i.giu { background: var(--loss); transform: translateX(-100%) }
.mag u { position: absolute; top: -2px; width: 2px; height: 10px; background: var(--faint); border-radius: 1px }
.idx { border-left: 3px solid var(--line) }
.idx.su { border-left-color: var(--gain) } .idx.giu { border-left-color: var(--loss) }
.att { font-family: var(--mono); font-size: 12px; padding: 1px 6px; border-radius: 4px; background: var(--sunk); border: 1px solid var(--line); white-space: nowrap }
.att.su { color: var(--gain); border-color: color-mix(in srgb, var(--gain) 40%, var(--line)) }
.att.giu { color: var(--loss); border-color: color-mix(in srgb, var(--loss) 40%, var(--line)) }
.mkt { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 13px 5px 11px; font-size: 13.5px }
.mkt .d { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex: none }
.mkt.on .d { background: var(--gain); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gain) 25%, transparent) }
.mkt.off .d { background: var(--faint) }
.mkt b { font-weight: 600 }
.mkt .cd { font-family: var(--mono); font-variant-numeric: tabular-nums }
.idxgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(210px,100%),1fr)); gap: 10px }
.idx { background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px }
.idx .n1 { display: flex; gap: 8px; align-items: baseline }
.idx .sym { font-family: var(--mono); font-weight: 600; font-size: 14px }
.idx .nome { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.idx .big { font-family: var(--mono); font-size: 22px; font-weight: 500 }
.idx .p { font-family: var(--mono); font-size: 13.5px; font-weight: 600; margin-left: auto }
.idx .range { height: 4px; background: var(--grid); border-radius: 2px; position: relative; margin-top: 3px }
.idx .range i { position: absolute; top: -2px; width: 2px; height: 8px; background: var(--fg); border-radius: 1px }
.piu { align-self: flex-start; margin-top: 6px }
.empty { padding: 18px 4px; color: var(--muted); font-size: 14px }
.stale { border-left: 3px solid var(--todo); background: var(--sunk); border-radius: 6px; padding: 9px 12px; font-size: 13px }
footer { font-size: 12px; color: var(--faint); line-height: 1.6 }
@media (max-width: 560px) {
  .row { grid-template-columns: 24px minmax(0,1fr) auto; }
  .row .pct { grid-column: 3; }
  .row .last { grid-column: 2; text-align: left; font-size: 14px }
  .row .who { grid-column: 2 }
  .ev { grid-template-columns: 48px 14px minmax(0,1fr); }
  .ev .val { grid-column: 3; }
}
</style>

<script>
const D = JSON.parse(document.getElementById("dati").textContent);
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = { get: k => { try { return localStorage.getItem(k) } catch (e) { return null } }, set: (k, v) => { try { localStorage.setItem(k, v) } catch (e) {} } };

const IT = { timeZone: "Europe/Rome" };
const ora = s => s ? new Date(s).toLocaleTimeString("it-IT", { ...IT, hour: "2-digit", minute: "2-digit" }) : "—";
const giorno = s => s ? new Date(s).toLocaleDateString("it-IT", { ...IT, weekday: "long", day: "numeric", month: "long" }) : "";
const dkey = s => { const d = new Date(s); return d.toLocaleDateString("sv-SE", IT); };
function fa(s) {
  if (!s) return "";
  const m = Math.round((Date.now() - new Date(s).getTime()) / 60000);
  if (m < 1) return "adesso";
  if (m < 60) return m + " min fa";
  const h = Math.round(m / 60);
  if (h < 24) return h + (h === 1 ? " ora fa" : " ore fa");
  const g = Math.round(h / 24);
  return g === 1 ? "ieri" : g + " giorni fa";
}
const n2 = v => v == null || !isFinite(v) ? "—" : Number(v).toLocaleString("it-IT", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = v => v == null || !isFinite(v) ? "—" : (v > 0 ? "+" : "") + Number(v).toLocaleString("it-IT", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "%";
const cls = v => v == null || !isFinite(v) ? "muted" : v > 0 ? "gain" : v < 0 ? "loss" : "muted";

const SIGLE = { "NQ=F": "NQ", "ES=F": "ES", "GC=F": "GC", "YM=F": "YM", "RTY=F": "RTY", "CL=F": "CL",
  "^NDX": "NDX", "^GSPC": "SPX", "^DJI": "DJI", "^RUT": "RUT", "^VIX": "VIX", "DX-Y.NYB": "DXY" };
const sigla = s => SIGLE[s] || String(s || "").replace(/^\^/, "").replace(/=F$/, "");
const S = { g: "azione", s: "pct", q: "", mia: new Set(), tutti: false };
try { const raw = store.get("radar-mia"); if (raw) S.mia = new Set(JSON.parse(raw)); } catch (e) {}
const salvaMia = () => store.set("radar-mia", JSON.stringify([...S.mia]));

function valore(x) {
  if (x == null) return null;
  const t = String(x).trim().replace(/[$€%\s]/g, "").replace(/,/g, "");
  const m = t.match(/^(-?\d+(?:\.\d+)?)([KMB])?$/i);
  if (!m) return null;
  const mult = { k: 1e3, m: 1e6, b: 1e9 }[(m[2] || "").toLowerCase()] || 1;
  return parseFloat(m[1]) * mult;
}
function attesa(att, prec) {
  const a = valore(att), p = valore(prec);
  if (a == null || p == null || !p) return "";
  const d = (a - p) / Math.abs(p) * 100;
  if (!isFinite(d) || Math.abs(d) < 0.05) return `<span class="att">in linea</span>`;
  return `<span class="att ${d > 0 ? "su" : "giu"}">${d > 0 ? "+" : ""}${Math.abs(d) >= 10 ? d.toFixed(0) : d.toFixed(1)}%</span>`;
}
function sorpresa(eff, att) {
  const e = valore(eff), a = valore(att);
  if (e == null || a == null || !a) return "";
  const d = (e - a) / Math.abs(a) * 100;
  if (!isFinite(d)) return "";
  return `<span class="att ${d >= 0 ? "su" : "giu"}">${d >= 0 ? "+" : ""}${Math.abs(d) >= 10 ? d.toFixed(0) : d.toFixed(1)}% sull'attesa</span>`;
}

function sintesi() {
  const P = D.prezzi || {}, tutti = P.items || [];
  const az = tutti.filter(x => x.gruppo === "azione" && isFinite(x.pct));
  const box = $("sintesi");
  $("sn-note").textContent = P.aggiornato ? "alle " + ora(P.aggiornato) + " · " + fa(P.aggiornato) : "in attesa del primo aggiornamento";
  if (!tutti.length) { box.innerHTML = '<div class="empty">In attesa del primo aggiornamento.</div>'; return; }
  const capo = s => tutti.find(x => x.sym === s);
  const tile = (k, it) => {
    if (!it) return "";
    return `<div class="tile"><div class="k">${esc(k)}</div><div class="v ${cls(it.pct)}">${pct(it.pct)}</div><div class="s">${n2(it.last)}</div></div>`;
  };
  const su = az.filter(x => x.pct > 0).length, giu = az.filter(x => x.pct < 0).length, pari = az.length - su - giu;
  const media = az.length ? az.reduce((t, x) => t + x.pct, 0) / az.length : 0;
  const q = az.length ? su / az.length * 100 : 50;
  box.innerHTML = tile("Nasdaq future", capo("NQ=F")) + tile("S&P future", capo("ES=F")) + tile("Oro future", capo("GC=F"))
    + tile("Volatilità", capo("^VIX"))
    + `<div class="tile" style="grid-column: 1/-1">
        <div class="k">Ampiezza del movimento · ${az.length} titoli del Nasdaq 100</div>
        <div class="breadth"><i class="su" style="width:${q.toFixed(1)}%"></i><i class="giu" style="width:${(100 - q).toFixed(1)}%"></i></div>
        <div class="legenda"><span><b class="gain">${su}</b> in rialzo</span><span><b class="loss">${giu}</b> in ribasso</span>${pari ? `<span><b>${pari}</b> invariati</span>` : ""}<span>variazione media <b class="${cls(media)}">${pct(media)}</b></span></div>
      </div>`;
}

function indici() {
  const P = D.prezzi || {}, a = (P.items || []).filter(x => x.gruppo === "indice" || x.gruppo === "futures");
  $("idx-note").textContent = P.aggiornato ? "alle " + ora(P.aggiornato) + " · " + fa(P.aggiornato) : "in attesa del primo aggiornamento";
  $("idx").innerHTML = a.length ? a.map(x => {
    const r = (x.low != null && x.high != null && x.high > x.low && x.last != null)
      ? Math.max(0, Math.min(100, (x.last - x.low) / (x.high - x.low) * 100)) : null;
    return `<div class="idx ${x.pct > 0 ? "su" : x.pct < 0 ? "giu" : ""}"><div class="n1"><span class="sym">${esc(sigla(x.sym))}</span><span class="nome">${esc(x.nome || "")}</span></div>
      <div class="n1"><span class="big">${n2(x.last)}</span><span class="p ${cls(x.pct)}">${pct(x.pct)}</span></div>
      ${r != null ? `<div class="range" title="minimo ${n2(x.low)} · massimo ${n2(x.high)}"><i style="left:${r.toFixed(1)}%"></i></div><div class="lbl-s">min ${n2(x.low)} · max ${n2(x.high)}</div>` : ""}</div>`;
  }).join("") : '<div class="empty">In attesa del primo aggiornamento.</div>';
}

function prezzi() {
  const box = $("prezzi"), P = D.prezzi || {};
  const items = (P.items || []).slice();
  $("pz-note").textContent = P.aggiornato ? "aggiornati alle " + ora(P.aggiornato) + " · " + fa(P.aggiornato) : "in attesa del primo aggiornamento";
  $("pz-fonte").textContent = P.fonte ? "Fonte dei prezzi: " + P.fonte + "." : "";
  if (!items.length) {
    box.innerHTML = '<div class="empty">Ancora nessun prezzo. Appena parte l\'aggiornamento automatico, qui compaiono indici, futures e azioni ordinati per quanto si stanno muovendo.</div>';
    return;
  }
  let a = items.filter(x => {
    if (S.g === "mia" && !S.mia.has(x.sym)) return false;
    if (S.g === "indice" && x.gruppo !== "indice" && x.gruppo !== "futures") return false;
    if (S.g === "azione" && x.gruppo !== "azione") return false;
    if (S.s === "su" && !(x.pct > 0)) return false;
    if (S.s === "giu" && !(x.pct < 0)) return false;
    if (S.q) { const q = S.q.toLowerCase(); if (!String(x.sym).toLowerCase().includes(q) && !sigla(x.sym).toLowerCase().includes(q) && !String(x.nome || "").toLowerCase().includes(q)) return false; }
    return true;
  });
  a.sort(S.s === "az" ? (x, y) => String(x.sym).localeCompare(String(y.sym))
    : S.s === "giu" ? (x, y) => (x.pct ?? 0) - (y.pct ?? 0)
    : S.s === "su" ? (x, y) => (y.pct ?? 0) - (x.pct ?? 0)
    : (x, y) => Math.abs(y.pct ?? 0) - Math.abs(x.pct ?? 0));
  if (!a.length) { box.innerHTML = '<div class="empty">Niente con questi filtri.</div>'; $("piu").hidden = true; return; }
  const tot = a.length, lim = 25;
  if (tot > lim && !S.tutti) { a = a.slice(0, lim); $("piu").hidden = false; $("piu").textContent = "Mostra tutti e " + tot; }
  else if (tot > lim) { $("piu").hidden = false; $("piu").textContent = "Mostra solo i primi " + lim; }
  else $("piu").hidden = true;
  const maxAbs = Math.max(1, ...a.map(x => Math.abs(x.pct || 0)));
  box.innerHTML = a.map(x => {
    const r = (x.low != null && x.high != null && x.high > x.low && x.last != null)
      ? Math.max(0, Math.min(100, (x.last - x.low) / (x.high - x.low) * 100)) : null;
    const w = Math.min(50, Math.abs(x.pct || 0) / maxAbs * 50);
    return `<div class="row">
      <button class="star" type="button" data-star="${esc(x.sym)}" aria-pressed="${S.mia.has(x.sym)}" aria-label="Aggiungi o togli dalla mia lista">${S.mia.has(x.sym) ? "★" : "☆"}</button>
      <div class="who"><span class="sym">${esc(sigla(x.sym))}</span>${x.gruppo === "futures" ? ' <span class="tag">future</span>' : x.gruppo === "indice" ? ' <span class="tag">indice</span>' : ""}<div class="nome">${esc(x.nome || "")}</div></div>
      <div class="last">${n2(x.last)}</div>
      <div class="pct ${cls(x.pct)}">${pct(x.pct)}</div>
      <div class="mag" title="${r != null ? `minimo ${n2(x.low)} · massimo ${n2(x.high)}` : pct(x.pct)}"><i class="${x.pct >= 0 ? "su" : "giu"}" style="width:${w.toFixed(2)}%"></i>${r != null ? `<u style="left:${r.toFixed(1)}%"></u>` : ""}</div>
    </div>`;
  }).join("");
}

function news() {
  const box = $("news"), N = D.news || {}, items = (N.items || []).slice(0, 40);
  $("nw-note").textContent = N.aggiornato ? (N.fonte ? N.fonte + " · " : "") + fa(N.aggiornato) : "in attesa del primo aggiornamento";
  box.innerHTML = items.length
    ? items.map(x => `<div class="nw"><span class="t">${esc(ora(x.t))}</span><span>${esc(x.titolo)}</span></div>`).join("")
    : '<div class="empty">Nessuna notizia caricata.</div>';
}

function trimestrali() {
  const T = D.trimestrali || {}, box = $("tri");
  const items = (T.items || []).filter(x => new Date(x.t).getTime() > Date.now() - 18 * 3600000)
    .sort((a, b) => a.t < b.t ? -1 : 1).slice(0, 40);
  $("tr-note").textContent = T.aggiornato ? (T.fonte ? T.fonte + " · " : "") + fa(T.aggiornato) : "in attesa del primo aggiornamento";
  if (!items.length) { box.innerHTML = '<div class="empty">Nessuna trimestrale in programma nei prossimi giorni fra quelle che muovono gli indici.</div>'; return; }
  let g = "", html = "";
  for (const x of items) {
    const k = dkey(x.t);
    if (k !== g) { g = k; html += `<div class="day">${esc(giorno(x.t))}</div>`; }
    const alto = String(x.impatto || "").toLowerCase() === "high";
    html += `<div class="ev"><span class="t">${esc(ora(x.t))}</span><span class="imp ${alto ? "alto" : "medio"}"></span>
      <span><b class="sym">${esc(x.sym || "")}</b> ${esc(x.nome || "")}${x.quando ? ` <span class="tag">${esc(x.quando)}</span>` : ""}</span>
      <span class="val">${x.atteso ? "atteso " + esc(x.atteso) : ""}${x.precedente ? " · un anno fa " + esc(x.precedente) : ""} ${attesa(x.atteso, x.precedente)}${x.effettivo ? ` · <b>uscito ${esc(x.effettivo)}</b> ${sorpresa(x.effettivo, x.atteso)}` : ""}</span></div>`;
  }
  box.innerHTML = html;
}

function calendario() {
  const box = $("cal"), C = D.calendario || {};
  const ora0 = Date.now() - 3600000;
  const items = (C.items || []).filter(x => new Date(x.t).getTime() > ora0).sort((a, b) => a.t < b.t ? -1 : 1).slice(0, 40);
  if (!items.length) { box.innerHTML = '<div class="empty">Nessun evento in programma nei dati attuali. Il calendario della settimana nuova viene pubblicato dalla fonte nel fine settimana.</div>'; return; }
  let g = "", html = "";
  for (const x of items) {
    const k = dkey(x.t);
    if (k !== g) { g = k; html += `<div class="day">${esc(giorno(x.t))}</div>`; }
    const imp = String(x.impatto || "").toLowerCase();
    html += `<div class="ev"><span class="t">${esc(ora(x.t))}</span><span class="imp ${imp === "high" ? "alto" : imp === "medium" ? "medio" : ""}"></span>
      <span><span class="cc">${esc(x.paese || "")}</span> ${esc(x.titolo)}</span>
      <span class="val">${x.forecast ? "attesa " + esc(x.forecast) : ""}${x.forecast && x.previous ? " · " : ""}${x.previous ? "prec. " + esc(x.previous) : ""} ${attesa(x.forecast, x.previous)}</span></div>`;
  }
  box.innerHTML = html;
}

function piede() {
  const f = [];
  if (D.prezzi && D.prezzi.fonte) f.push("prezzi: " + D.prezzi.fonte);
  if (D.news && D.news.fonte) f.push("news: " + D.news.fonte);
  if (D.trimestrali && D.trimestrali.fonte) f.push("trimestrali: " + D.trimestrali.fonte);
  if (D.calendario && D.calendario.fonte) f.push("calendario: " + D.calendario.fonte);
  $("piede").innerHTML = esc("Fonti — " + f.join(" · ") + ".") +
    "<br>Pagina aggiornata a intervalli, non in diretta: l'orario accanto a ogni sezione dice di quando sono i dati. Non è una fonte per eseguire ordini e non è un consiglio finanziario.";
  $("sub").textContent = D.aggiornato ? "ultimo aggiornamento " + ora(D.aggiornato) + " · " + giorno(D.aggiornato) : "in attesa del primo aggiornamento";
}

/* ---------- Stato della sessione di New York ---------- */
const NYF = new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false, weekday: "short" });
function nyOra(d) {
  const p = {}; for (const x of NYF.formatToParts(d)) p[x.type] = x.value;
  const h = p.hour === "24" ? 0 : +p.hour;
  return { y: +p.year, m: +p.month, g: +p.day, min: h * 60 + (+p.minute), sec: +p.second, dow: ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(p.weekday) };
}
function pasqua(y) { // Meeus/Jones/Butcher
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4,
    f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
    i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
    mese = Math.floor((h + l - 7 * m + 114) / 31), gg = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(Date.UTC(y, mese - 1, gg));
}
const gUTC = d => d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0") + "-" + String(d.getUTCDate()).padStart(2, "0");
function nthDow(y, mese, dow, n) { // n-esimo <dow> del mese (n negativo = ultimo)
  if (n > 0) { const d = new Date(Date.UTC(y, mese, 1)); d.setUTCDate(1 + ((dow - d.getUTCDay() + 7) % 7) + (n - 1) * 7); return d; }
  const d = new Date(Date.UTC(y, mese + 1, 0)); d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() - dow + 7) % 7)); return d;
}
function festivi(y) {
  const f = new Set(), fisse = [[0, 1], [5, 19], [6, 4], [11, 25]];
  for (const [me, gg] of fisse) {
    const d = new Date(Date.UTC(y, me, gg)), w = d.getUTCDay();
    if (w === 6) d.setUTCDate(gg - 1); else if (w === 0) d.setUTCDate(gg + 1);
    f.add(gUTC(d));
  }
  f.add(gUTC(nthDow(y, 0, 1, 3)));   // Martin Luther King
  f.add(gUTC(nthDow(y, 1, 1, 3)));   // Presidents' Day
  const pq = pasqua(y); pq.setUTCDate(pq.getUTCDate() - 2); f.add(gUTC(pq)); // Venerdì santo
  f.add(gUTC(nthDow(y, 4, 1, -1)));  // Memorial Day
  f.add(gUTC(nthDow(y, 8, 1, 1)));   // Labor Day
  f.add(gUTC(nthDow(y, 10, 4, 4)));  // Ringraziamento
  return f;
}
const CACHE = {};
const fest = y => (CACHE[y] = CACHE[y] || festivi(y));
function mezzaGiornata(y, m, g) {
  const k = y + "-" + String(m).padStart(2, "0") + "-" + String(g).padStart(2, "0");
  const rg = nthDow(y, 10, 4, 4); rg.setUTCDate(rg.getUTCDate() + 1);
  const l3 = new Date(Date.UTC(y, 6, 3)), v24 = new Date(Date.UTC(y, 11, 24));
  return k === gUTC(rg) || (k === gUTC(l3) && l3.getUTCDay() > 0 && l3.getUTCDay() < 6)
    || (k === gUTC(v24) && v24.getUTCDay() > 0 && v24.getUTCDay() < 6);
}
function sessione(y, m, g, dow) {
  const k = y + "-" + String(m).padStart(2, "0") + "-" + String(g).padStart(2, "0");
  if (dow === 0 || dow === 6 || fest(y).has(k)) return null;
  return { ap: 9 * 60 + 30, ch: mezzaGiornata(y, m, g) ? 13 * 60 : 16 * 60 };
}
function statoMercato(d) {
  const n = nyOra(d), s = sessione(n.y, n.m, n.g, n.dow);
  if (s && n.min >= s.ap && n.min < s.ch) return { on: true, min: s.ch - n.min - 1, sec: 60 - n.sec };
  let att = s && n.min < s.ap ? s.ap - n.min - 1 : null, sec = 60 - n.sec;
  if (att == null) {
    att = 1440 - n.min - 1;
    for (let i = 1; i <= 10; i++) {
      const dd = new Date(Date.UTC(n.y, n.m - 1, n.g + i)), nx = sessione(dd.getUTCFullYear(), dd.getUTCMonth() + 1, dd.getUTCDate(), dd.getUTCDay());
      if (nx) { att += nx.ap; break; }
      att += 1440;
    }
  }
  return { on: false, min: att, sec };
}
function durata(min, sec) {
  if (min >= 60) { const h = Math.floor(min / 60); return h + "h " + String(min % 60).padStart(2, "0") + "m"; }
  return min + "m " + String(sec % 60).padStart(2, "0") + "s";
}
function mercato() {
  const st = statoMercato(new Date()), el = $("mkt");
  el.className = "mkt " + (st.on ? "on" : "off");
  $("mkt-t").innerHTML = st.on
    ? "<b>Mercato aperto</b> · chiude tra <span class=\"cd\">" + durata(st.min, st.sec) + "</span>"
    : "<b>Mercato chiuso</b> · apre tra <span class=\"cd\">" + durata(st.min, st.sec) + "</span>";
  el.title = "Borsa di New York, 9:30–16:00 ora di New York. Festività e mezze giornate incluse.";
}

function render() { mercato(); sintesi(); indici(); prezzi(); news(); trimestrali(); calendario(); piede(); }

document.addEventListener("click", ev => {
  const g = ev.target.closest("[data-g]");
  if (g) { S.g = g.dataset.g; document.querySelectorAll("[data-g]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.g === S.g))); prezzi(); return; }
  const s = ev.target.closest("[data-s]");
  if (s) { S.s = s.dataset.s; document.querySelectorAll("[data-s]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.s === S.s))); prezzi(); return; }
  const st = ev.target.closest("[data-star]");
  if (st) { const k = st.dataset.star; S.mia.has(k) ? S.mia.delete(k) : S.mia.add(k); salvaMia(); prezzi(); return; }
  if (ev.target.closest("#piu")) { S.tutti = !S.tutti; prezzi(); return; }
  if (ev.target.closest("#tema")) {
    const cur = document.documentElement.getAttribute("data-theme");
    const scuro = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", scuro ? "light" : "dark");
    store.set("radar-tema", scuro ? "light" : "dark");
  }
});
$("cerca").addEventListener("input", e => { S.q = e.target.value.trim(); prezzi(); });
const tema = store.get("radar-tema"); if (tema) document.documentElement.setAttribute("data-theme", tema);
render();
setInterval(mercato, 1000);
setInterval(() => { sintesi(); indici(); prezzi(); news(); }, 60000);
</script>
